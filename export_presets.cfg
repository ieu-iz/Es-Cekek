; Es Cekek — export presets (Godot 4.x).
;
; PRESET INI
; Godot reads this file from the project root. It is safe to hand-edit it, but
; the editor rewrites/normalises it whenever the Export dialog is saved.
;
; PERSIAPAN WAJIB SEBELUM EXPORT:
;   1. Pasang export template: Godot Editor -> Editor -> Manage Export Templates
;      -> download versi 4.7.2 (butuh ~1 GB, sekali saja).
;   2. Untuk Android: pasang Android SDK + JDK, lalu set "Android SDK Path"
;      di Editor Settings. Godot otomatis membuat debug keystore bila belum ada.
;
; CATATAN: preset "Windows Desktop" menghasilkan .exe + .pck,
; preset "Android" menghasilkan .apk ke folder build/.

